name: example
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+43

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  mixpanel_flutter_session_replay:
    path: ../
  http: ^1.2.0
  logging: ^1.2.0
  intl: ^0.19.0
  provider: ^6.0.0
  path_provider: ^2.1.0
  image: ^4.3.0
  mixpanel_flutter: ^3.1.0

# Web replay needs the per-tab `$mp_replay_id` registration and the event bridge
# that shipped in mixpanel_flutter 3.1.0, hence the constraint above. The
# overrides keep the example and CI on the in-repo packages, so a change to
# either is exercised here before it is released.
dependency_overrides:
  mixpanel_flutter:
    path: ../../mixpanel_flutter
  mixpanel_flutter_common:
    path: ../../mixpanel_flutter_common

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  web: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/test_data.json
    - assets/compression_golden/android/
    - assets/compression_golden/ios/
    - assets/compression_golden/macos/
